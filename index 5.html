<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dota Помощник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--tx:#111;--card:#f1f2f5;--ac:#2a7de1;--mut:#777}
@media (prefers-color-scheme:dark){:root{--bg:#17181c;--tx:#eee;--card:#25262c;--mut:#999}}
:root{--bg:var(--tg-theme-bg-color,var(--bg));--tx:var(--tg-theme-text-color,var(--tx));--card:var(--tg-theme-secondary-bg-color,var(--card));--ac:var(--tg-theme-button-color,var(--ac))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:0 12px 80px;padding-top:env(safe-area-inset-top,0)}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
nav button{flex:1;padding:9px 4px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:13px}
nav button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}
.row img{width:56px;height:32px;border-radius:6px;object-fit:cover}
.row b{flex:1}.mut{color:var(--mut);font-size:13px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--tx);font-size:15px;margin:6px 0}
.btn{display:block;text-align:center;padding:11px;border-radius:10px;background:var(--ac);color:#fff;text-decoration:none;border:0;width:100%;font-size:15px;margin:6px 0}
.mvp{border:2px solid gold}
.tbl{overflow-x:auto}
section{display:none}section.on{display:block}
</style>
</head>
<body>
<nav>
<button class="on" data-t="meta">Мета</button>
<button data-t="hero">Герой</button>
<button data-t="match">Матч</button>
<button data-t="order">Заказ</button>
</nav>

<section id="meta" class="on"><div id="metaList" class="mut">Загрузка…</div></section>

<section id="hero">
<input id="heroIn" list="heroNames" placeholder="Имя героя, например Pudge">
<datalist id="heroNames"></datalist>
<div id="heroOut" class="mut">Введи героя и выбери из списка.</div>
</section>

<section id="match">
<input id="matchIn" inputmode="numeric" placeholder="ID матча">
<button class="btn" id="matchBtn">Разобрать матч</button>
<div id="matchOut" class="mut">Матч должен быть публичным.</div>
</section>

<section id="order">
<div class="card"><b>Хочешь такого бота или приложение?</b><br>
<span class="mut">Для твоего канала, стрима или клуба: разборы матчей, мини-игры, FAQ.</span></div>
<a class="btn" id="contactBtn" style="display:none">Написать мне</a>
<a class="btn" id="donateBtn" style="display:none">Поддержать проект</a>
</section>

<script>
// ===== НАСТРОЙКИ: впиши свои ссылки =====
const CONTACT = "";   // например "https://t.me/твой_ник"
const DONATE = "";    // ссылка на донат (оформляется через родителей)
// ========================================
const API = "https://api.opendota.com/api", CDN = "https://cdn.cloudflare.steamstatic.com";
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = async p => { const r = await fetch(API + p); if (!r.ok) throw 0; return r.json(); };
let HEROES = [];

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button,section").forEach(e => e.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.t).classList.add("on");
});
if (CONTACT) { $("contactBtn").href = CONTACT; $("contactBtn").style.display = "block"; }
if (DONATE) { $("donateBtn").href = DONATE; $("donateBtn").style.display = "block"; }

const tot = h => { let p = 0, w = 0; for (let i = 1; i <= 8; i++) { p += h[i + "_pick"] || 0; w += h[i + "_win"] || 0; } return [p, w]; };

async function init() {
  try {
    HEROES = await get("/heroStats");
    $("heroNames").innerHTML = HEROES.map(h => `<option value="${esc(h.localized_name)}">`).join("");
    const mx = Math.max(...HEROES.map(h => tot(h)[0]));
    const list = HEROES.map(h => { const [p, w] = tot(h); return {h, p, wr: p ? w / p * 100 : 0}; })
      .filter(x => x.p >= mx * 0.2).sort((a, b) => b.wr - a.wr).slice(0, 15);
    $("metaList").innerHTML = "<div class='mut'>Лучший винрейт среди популярных героев</div>" +
      list.map((x, i) => `<div class="card row"><span>${i + 1}</span><img src="${CDN}${x.h.img}"><b>${esc(x.h.localized_name)}</b><span>${x.wr.toFixed(1)}%</span></div>`).join("");
  } catch (e) { $("metaList").textContent = "Не удалось загрузить данные. Попробуй позже."; }
}

$("heroIn").addEventListener("change", async () => {
  const q = $("heroIn").value.trim().toLowerCase();
  const h = HEROES.find(x => x.localized_name.toLowerCase() === q);
  if (!h) return;
  $("heroOut").textContent = "Загрузка…";
  try {
    const [pop, items, lanes] = await Promise.all([get(`/heroes/${h.id}/itemPopularity`), get("/constants/items"), get(`/scenarios/laneRoles?hero_id=${h.id}`)]);
    const nm = {}; Object.entries(items).forEach(([k, v]) => nm[v.id] = v.dname || k);
    const L = {1: "Лёгкая линия", 2: "Мид", 3: "Сложная линия", 4: "Лес"}, agg = {};
    lanes.forEach(r => agg[r.lane_role] = (agg[r.lane_role] || 0) + +r.games);
    const sum = Object.values(agg).reduce((a, b) => a + b, 0) || 1;
    const lanesHtml = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${L[k] || k}: ${(v / sum * 100).toFixed(0)}%`).join(" · ");
    const ph = [["start_game_items", "🎒 Старт"], ["early_game_items", "⚔️ Лейнинг"], ["mid_game_items", "🛡 Мид"], ["late_game_items", "👑 Лейт"]];
    const itemsHtml = ph.map(([k, t]) => `<div>${t}: ${Object.entries(pop[k] || {}).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([i]) => esc(nm[i] || i)).join(", ")}</div>`).join("");
    const [p, w] = tot(h), yt = "https://www.youtube.com/results?search_query=";
    $("heroOut").innerHTML = `<div class="card row"><img src="${CDN}${h.img}"><b>${esc(h.localized_name)}</b><span>${p ? (w / p * 100).toFixed(1) : "-"}%</span></div>
      <div class="card"><div class="mut">Роли: ${esc((h.roles || []).join(", "))}</div><div>📍 ${lanesHtml}</div></div>
      <div class="card">${itemsHtml}</div>
      <a class="btn" target="_blank" href="${yt + encodeURIComponent(h.localized_name + " дота 2 гайд")}">🎬 Гайд на русском</a>
      <a class="btn" target="_blank" href="${yt + encodeURIComponent(h.localized_name + " dota 2 guide")}">🎬 Guide (English)</a>`;
  } catch (e) { $("heroOut").textContent = "Ошибка загрузки."; }
});

const score = p => (p.kills || 0) * 3 + (p.assists || 0) * 1.5 - (p.deaths || 0) * 2 + (p.gold_per_min || 0) / 50 + (p.hero_damage || 0) / 1000 + (p.tower_damage || 0) / 500 + (p.hero_healing || 0) / 800;

$("matchBtn").onclick = async () => {
  const id = $("matchIn").value.trim(); if (!/^\d+$/.test(id)) return;
  $("matchOut").textContent = "Загрузка…";
  try {
    const m = await get("/matches/" + id), ps = m.players;
    ps.forEach(p => { p.s = score(p); const h = HEROES.find(x => x.id === p.hero_id); p.hn = h ? h.localized_name : "?"; });
    const mvp = ps.reduce((a, b) => b.s > a.s ? b : a);
    const best = k => ps.reduce((a, b) => (b[k] || 0) > (a[k] || 0) ? b : a);
    const line = p => `<div class="card ${p === mvp ? "mvp" : ""}">${p === mvp ? "👑 " : ""}<b>${esc(p.personaname || "Аноним")}</b> <span class="mut">${esc(p.hn)}</span><br>${p.kills}/${p.deaths}/${p.assists} · GPM ${p.gold_per_min} · оценка ${p.s.toFixed(0)}</div>`;
    const side = r => ps.filter(p => (p.player_slot < 128) === r).sort((a, b) => b.s - a.s).map(line).join("");
    const nm = p => esc(p.personaname || "Аноним") + " (" + esc(p.hn) + ")";
    $("matchOut").innerHTML = `<div class="card"><b>Победил: ${m.radiant_win ? "Свет" : "Тьма"}</b> · ${Math.floor(m.duration / 60)} мин<br>
      🏆 MVP: ${nm(mvp)}<br>💥 Урон: ${nm(best("hero_damage"))}<br>💰 GPM: ${nm(best("gold_per_min"))}<br>🏰 Строения: ${nm(best("tower_damage"))}</div>
      <b>☀️ Свет</b>${side(true)}<b>🌑 Тьма</b>${side(false)}`;
  } catch (e) { $("matchOut").textContent = "Матч не найден или закрыт."; }
};
init();
</script>
</body>
</html>
